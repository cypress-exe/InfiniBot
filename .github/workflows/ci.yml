name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual triggering
permissions:
  contents: read
jobs:
  # Build job for Jekyll site
  build-pages-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
          working-directory: github-pages-site
      - name: Install dependencies
        run: |
          cd github-pages-site
          bundle install
      - name: Build with Jekyll
        run: |
          cd github-pages-site
          bundle exec jekyll build

  # Fast path: run the suite directly on the runner. This is the job that gates
  # merges; it finishes in seconds because it skips the Docker build entirely.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Fails the build if total coverage drops below the floor in
      # [tool.coverage.report] fail_under.
      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  # Slow path: run the same suite inside the shipped image, to catch drift
  # between the runner's environment and the container's.
  docker-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate build info & environment
        run: ./build.bash --use-cache --skip-docker # Dry run (no docker build)

      - name: Build test image with Buildx cache
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          target: test
          load: true
          tags: infinibot:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No coverage here; the fast job already measures it and enforces the floor.
      - name: Run tests in the image
        run: ./run_tests.bash --skip-build
