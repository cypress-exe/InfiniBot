# Sources for scale_assets.py.
#
# Some sites that embed our images can't resize them at render time —
# discordbotlist.com, for instance, gives you a markdown box with no width
# control. Every asset listed here gets a resized variant generated beside it in
# a `discordbotlist-variants/` directory, which those sites can link to directly.
#
# Paths are relative to this file. After editing, run:
#
#     uv run scale_assets.py
#
# `width` is the target width in pixels; height follows from the aspect ratio.
# A width larger than the source upscales it — allowed, but it adds blur rather
# than detail, so only ask for it deliberately.
#
# GIFs are resized with gifsicle rather than ffmpeg. See scale_assets.py for the
# reasoning; the short version is that ffmpeg discards the frame differencing
# that keeps an animated GIF small, and its output came out larger than the
# source it was shrinking.

output_dir: discordbotlist-variants

assets:
  - src: assets/images/header-image.png
    width: 700

  - src: assets/demos/dashboard.gif
    width: 550

  - src: assets/demos/disable-features.gif
    width: 550

  - src: assets/demos/profanity-moderation.gif
    width: 550

  - src: assets/demos/logging.gif
    width: 550

  # Source is only 401x401, so this one is an upscale.
  - src: assets/demos/join-message.png
    width: 550

  - src: assets/demos/leveling.gif
    width: 550

  - src: assets/demos/role-messages.gif
    width: 550

  - src: assets/demos/purging.gif
    width: 550
