[project]
name = "infinibot"
version = "4.1.1"
description = "A powerful, multi-purpose Discord utility bot built for millions of servers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "APScheduler==3.11.2",
    "dateparser==1.4.1",
    "humanfriendly==10.0",
    "nextcord==3.2.0",
    "nextcord-ext-menus==1.5.7",
    "rapidfuzz==3.14.5",
    "python-dateutil==2.9.0.post0",
    "SQLAlchemy==2.0.46",
    "topggpy==1.4.0",
    "cachetools==7.1.4",
    "psutil==7.2.2",
    "discordlists-py==1.1.1",
]

[dependency-groups]
# Test-only dependencies. Excluded from the production image, which builds with
# `uv sync --frozen --no-dev`; the Dockerfile's `test` stage syncs them back in.
dev = [
    "pytest==9.0.1",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
]

[tool.uv]
# Application, not an installable package: `uv sync` installs dependencies only
package = false

[tool.pytest.ini_options]
# Imports are rooted at src/ to match the container's WORKDIR (`python3 ./src/...`),
# so `import core.db_manager` resolves the same on the host and in Docker.
# The repo root comes first so `tests.support` resolves to the tests package.
pythonpath = [".", "src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers -ra"
markers = [
    "integration: exercises a real SQLite database",
    "slow: takes more than a second (real sleeps, large data sets)",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/main.py",           # process entrypoint
    "src/event_harness.py",  # synthetic-load benchmark, not shipped behavior
]

[tool.pyright]
# Editor language server (pyright/basedpyright/Pylance): use the uv-managed
# venv and resolve imports rooted at src/ (matching the container's WORKDIR)
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
pythonVersion = "3.13"
# IntelliSense only (completions, hover, go-to-definition) — no type-error
# diagnostics; the codebase is too far along to be fully typed
typeCheckingMode = "off"
